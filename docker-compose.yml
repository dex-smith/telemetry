services:
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        environment:
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_NAME}
        expose:
            - "5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -p 5432"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    valkey:
        image: valkey/valkey-bundle:8.1.3
        container_name: valkey
        environment:
            - VALKEY_USERNAME=${CACHE_USERNAME}
            - VALKEY_PASSWORD=${CACHE_PASSWORD}
            - VALKEY_TLS=${CACHE_TLS}
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 60s

    rustfs:
        image: rustfs/rustfs:1.0.4
        container_name: rustfs
        environment:
            - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
            - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
            - RUSTFS_CONSOLE_ENABLE=true
        volumes:
            - rustfs_data:/data
        ports:
            - "127.0.0.1:9000:9000"
            - "127.0.0.1:9001:9001"
        restart: unless-stopped
        healthcheck:
            test:
                ["CMD", "curl", "-f", "http://localhost:9000/health"]
            interval: 60s
            timeout: 5s
            retries: 5
            start_period: 30s

    cert-generator:
        image: alpine:3.20
        container_name: cert-generator
        environment:
            - SERVER_NAME=${APP_DOMAIN}
        volumes:
            - ./certs:/etc/nginx/certs
            - ./nginx/scripts/generate_dev_certs.sh:/usr/local/bin/generate_dev_certs.sh:ro
        entrypoint: ["/bin/sh", "/usr/local/bin/generate_dev_certs.sh"]
        restart: "no"

    nginx:
        image: nginxinc/nginx-unprivileged:alpine3.24-perl
        container_name: nginx
        ports:
            - "80:80"
            - "443:443"
        cap_add:
            - CAP_NET_BIND_SERVICE
        environment:
            - SERVER_NAME=${APP_DOMAIN}
            - SSL_CERTIFICATE=/etc/nginx/certs/fullchain.pem
            - SSL_CERTIFICATE_KEY=/etc/nginx/certs/privkey.pem
        volumes:
            - ./certs:/etc/nginx/certs:ro
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/templates:/etc/nginx/templates:ro
        depends_on:
            cert-generator:
                condition: service_completed_successfully
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -f http://localhost:8080/nginx_status",
                ]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 30s

    loki:
        image: grafana/loki:3.7.7
        container_name: loki
        expose:
            - "3100"
        restart: unless-stopped
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - loki_data:/loki

    tempo:
        image: grafana/tempo:2.8.2
        container_name: tempo
        expose:
            - "3200"
            - "4317"
            - "4318"
        ports:
            - "127.0.0.1:3200:3200"
        restart: unless-stopped
        volumes:
            - ./tempo/tempo.yaml:/etc/tempo/config.yaml:ro
            - tempo_data:/var/tempo
        command: ["-config.file=/etc/tempo/config.yaml"]
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 10s

    grafana:
        image: grafana/grafana:12.4.10
        container_name: grafana
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
            - GF_SERVER_SERVE_FROM_SUB_PATH=true
            - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
        ports:
            - "127.0.0.1:3000:3000"
        restart: unless-stopped
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    prometheus:
        image: prom/prometheus:v3.14.0
        container_name: prometheus
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        restart: unless-stopped

    nginx-exporter:
        image: nginx/nginx-prometheus-exporter:1.5.3
        container_name: nginx-exporter
        command:
            - -nginx.scrape-uri=http://nginx:8080/nginx_status
        restart: unless-stopped

    alloy:
        image: grafana/alloy:v1.19.2
        container_name: alloy
        user: root
        expose:
            - "4317"
            - "4318"
        ports:
            - "127.0.0.1:4317:4317"
            - "127.0.0.1:4318:4318"
        restart: unless-stopped
        privileged: true
        devices:
            - /dev/kmsg
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
        command:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.alloy

volumes:
    postgres_data:
    rustfs_data:
    loki_data:
    grafana_data:
    prometheus_data:
    tempo_data:
