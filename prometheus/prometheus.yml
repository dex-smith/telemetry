global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    metrics_path: /api/v0/component/prometheus.exporter.cadvisor.default/metrics
    static_configs:
      - targets: ['alloy:12345']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
